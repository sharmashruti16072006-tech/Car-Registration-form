<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rental Car Registration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="logo">

<i class="fa-solid fa-car-side"></i>

</div>

<h1>Rental Car</h1>

<h2>Registration</h2>

<form>

<div class="input-box">

<label>

<i class="fa-regular fa-user"></i>

Full Name

</label>

<input
type="text"
placeholder="Enter your full name"
required>

</div>

<div class="input-box">

<label>

<i class="fa-regular fa-id-card"></i>

Driver's License Number

</label>

<input
type="text"
placeholder="Enter license number"
required>

</div>

<div class="input-box">

<label>

<i class="fa-solid fa-phone"></i>

Phone Number

</label>

<input
type="tel"
placeholder="Enter phone number"
required>

</div>

<div class="input-box">

<label>

<i class="fa-regular fa-envelope"></i>

Email Address

</label>

<input
type="email"
placeholder="Enter email address"
required>

</div>

<div class="input-box full">

<label>

<i class="fa-solid fa-car"></i>

Car Model

</label>

<select required>

<option value="">Select a Car</option>

<option>Audi Q8</option>

<option>BMW X5</option>

<option>Mercedes GLC</option>

<option>Toyota Fortuner</option>

<option>Mahindra XUV700</option>

</select>

</div>

<div class="input-box">

<label>

<i class="fa-regular fa-calendar"></i>

Pickup Date

</label>

<input
type="date"
required>

</div>

<div class="input-box">

<label>

<i class="fa-regular fa-calendar"></i>

Return Date

</label>

<input
type="date"
required>

</div>

<button>

<i class="fa-solid fa-car"></i>

Register Now

</button>

</form>

<div class="features">

<div>

<i class="fa-regular fa-gem"></i>

<h3>Premium Cars</h3>

<p>Top quality vehicles</p>

</div>

<div>

<i class="fa-solid fa-tags"></i>

<h3>Best Prices</h3>

<p>Affordable rates</p>

</div>

<div>

<i class="fa-solid fa-headset"></i>

<h3>24/7 Support</h3>

<p>Always available</p>

</div>

</div>

<footer>

© 2026 Rental Cars

</footer>

</div>

</body>

</html>
